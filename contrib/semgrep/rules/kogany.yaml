#
# kogany-specific Semgrep rules, scanned beside the pinned semgrep-rules packs
# (contrib/semgrep/README.md). Each rule has a positive and a negative case in kogany.rs beside this
# file (`contrib/semgrep/scan.py --test`, the secops.yml `semgrep-rules` job). metadata.bucket pins
# a rule's bucket; without it the bucket follows severity/impact/confidence.
rules:
  - id: kogany.consensus.ycash-branch-id-literal-outside-definition
    languages: [rust]
    # Ycash's own consensus branch IDs (0x374d694f Ycash, 0x6d5b7a31 Vault) get exactly one
    # definition in kogany: the network-upgrade table of zakura-chain (W1-Y1, W2), beside the
    # fork's BranchId (zakura-common-ycash, W1-Y0). Anywhere else a literal is a second definition
    # that a later branch-ID change would miss. Tests that pin the value against the definition
    # are excluded by path and by assertion.
    paths:
      exclude:
        - "/crates/zakura-chain/src/parameters/network_upgrade.rs"
        - "**/tests/**"
        - "*tests.rs"
    patterns:
      - pattern-regex: (?i)\b0x(6d5b_?7a31|374d_?694f)(_?u32)?\b
      - pattern-not-regex: (?i)//[^\n]*0x(6d5b_?7a31|374d_?694f)
      - pattern-not-inside: assert_eq!(...)
      - pattern-not-inside: assert_ne!(...)
    message: >-
      A Ycash consensus branch ID literal outside its one definition (the network-upgrade table in
      zakura-chain). ZIP-143/243 signature hashes commit to the branch ID, so a second copy that
      drifts from the definition makes this code sign or verify for a different chain. Use the
      NetworkUpgrade / ConsensusBranchId accessors instead.
    severity: WARNING
    metadata:
      category: security
      bucket: high
      cwe: ["CWE-1109: Use of Same Variable for Multiple Purposes"]
      references: ["crates/zakura-chain/src/parameters/network_upgrade.rs",
                   "https://zips.z.cash/zip-0200"]
