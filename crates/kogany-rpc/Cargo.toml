[package]
name = "kogany-rpc"
version = "0.1.0"
authors = ["The Ycash developers"]
description = "kogany's JSON-RPC methods for the vault primitive and Yellowback (vault_*, set_*, yed_*), dispatched beside Zakura's RpcServer"
license = "MIT"
repository = "https://github.com/boyfromcave/kogany"
edition.workspace = true
rust-version.workspace = true
publish = false

# The integration hook crate (plan W7): it implements zakura-rpc's RpcMethods, so it depends on
# zakura-rpc and zakura-chain; the vault parsing is kogany-vault's; the live vault state is
# zakura-state's (W4-d).
[features]
# The Ycash network profile (tests/live_state.rs replays Ycash regtest blocks), and the
# `getblocktemplate` hooks over the Yellowback state (plan W8, `mining`), which need
# zakura-rpc's `ycash` hooks.
ycash = ["zakura-chain/ycash", "zakura-rpc/ycash", "zakura-script/ycash", "zakura-state/ycash"]

[dependencies]
async-trait = { workspace = true }
hex = { workspace = true }
serde = { workspace = true, features = ["serde_derive"] }
# preserve_order: the json!-built objects (yed_getinfo.params, yed_decodepayload) keep ycashd's
# field order (zakurad enables it too).
serde_json = { workspace = true, features = ["raw_value", "preserve_order"] }
tower = { workspace = true, features = ["util"] }
tracing = { workspace = true }

kogany-vault = { path = "../kogany-vault" }
kogany-yellowback = { path = "../kogany-yellowback" }
# The miner address's P2PKH key hash: the YED payout key (W5-f, ycashd -yellowbackpayoutaddress).
zcash_address = { workspace = true }
zcash_protocol = { workspace = true }
zakura-chain = { path = "../zakura-chain", version = "11.0.0-rc0" }
zakura-rpc = { path = "../zakura-rpc", version = "13.0.1-rc0", default-features = false }
# The mempool's request types: yed_getvault.spendPending and getaddressmempool (S5, F-S5-5).
zakura-node-services = { path = "../zakura-node-services", version = "5.0.1-rc0" }
# W7-b: yed_validaterawtransaction's script check (VerifyAllInputs at tip + 1).
zakura-script = { path = "../zakura-script", version = "5.0.1-rc0" }
# W4-d: the live vault state is the read state service's best-chain vault snapshot.
zakura-state = { path = "../zakura-state", version = "12.0.0-rc0" }

[dev-dependencies]
# insight.rs's test sets a mempool entry's time.
chrono = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# W4-d: tests/live_state.rs commits the recorded chain to a test state service.
zakura-state = { path = "../zakura-state", version = "12.0.0-rc0", features = ["proptest-impl"] }

[lints]
workspace = true
