[package]
name = "kogany-vault"
version = "0.1.0"
authors = ["The Ycash developers"]
description = "The Vault upgrade's lock/unlock primitive for kogany: the V/I/B script templates and the `YV` act codec (byte-exact ports of ycash6 src/vault/template.* and act.*)"
license = "MIT"
repository = "https://github.com/boyfromcave/kogany"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ripemd = { workspace = true }
secp256k1 = { workspace = true, features = ["recovery"] }
sha2 = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
