name: kogany-yellowback

# kogany's own legs (plan docs/plans/kogany/kogany-yellowback-plan.md §5; .github/README-kogany.md).
# The audit logic is qa/kogany_audit.py (stdlib Python, tested by qa/test_kogany_audit.py); this
# file only runs it.
#
#   audit      (a) consensus-diff   report-only: the consensus path set vs kogany-baseline
#              (b) frozen-file      report-only: qa/kogany-frozen-files.txt vs kogany-legacy
#              (e) greps            blocking: naming (AGENTS.md rule 6) and attribution (rule 8)
#              dormancy             blocking: no upstream test function deleted
#              workflows            blocking: every workflow classified in .github/kogany-workflows.txt
#              The reports are the `kogany-audit` artifact and the step summary.
#   build      the feature matrix: `ycash` off and on, both blocking.
#
# Legs that start later (plan §5): (c) cross-line identity and (d) vault-params from W2, the
# vectors from W2, kogany-regtest from W4, mixed-regtest from W1, sidecar/parity at W9/S5.
#
# Triggers: every pull_request, push to upgrade/vault and vaults/kogany-compat, workflow_dispatch.
on:
  push:
    branches: ['upgrade/vault', 'vaults/kogany-compat']
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: kogany-yellowback-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # the legs diff against kogany-legacy / kogany-baseline and read the commit log
          persist-credentials: false
      - name: Fetch the baselines
        # kogany-legacy is a branch and kogany-baseline a tag; a pull_request checkout has neither
        # as a local ref, so name them explicitly (the tag is absent until the coordinator sets it).
        run: |
          git fetch --no-tags origin '+refs/heads/kogany-legacy:refs/remotes/origin/kogany-legacy'
          git fetch --no-tags origin '+refs/tags/kogany-baseline:refs/tags/kogany-baseline' || echo "no kogany-baseline tag yet: consensus-diff uses kogany-legacy"
      - name: Audit script tests
        run: python3 -m unittest discover -s qa -p 'test_kogany_*.py'
      - name: Audit legs
        run: python3 qa/kogany_audit.py --out kogany-audit-out all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: kogany-audit
          path: kogany-audit-out
          retention-days: 30
          if-no-files-found: ignore

  build:
    name: build (ycash feature ${{ matrix.ycash && 'on' || 'off' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ycash: [false, true]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f #v2.0.0 # zizmor: ignore[cache-poisoning] -- check-only build of the node, nothing published or released
        with:
          toolchain: stable
          cache-key: kogany-build-${{ matrix.ycash && 'ycash' || 'default' }}
          cache-on-failure: true
          cache-save-if: ${{ github.ref == 'refs/heads/vaults/kogany-compat' || github.ref == 'refs/heads/upgrade/vault' }}
      - uses: ./.github/actions/setup-zakura-build
      - name: cargo check (ycash feature ${{ matrix.ycash && 'on' || 'off' }})
        env:
          YCASH: ${{ matrix.ycash }}
        run: |
          features=()
          if [ "$YCASH" = true ]; then features=(--features ycash); fi
          cargo check --locked -p zakura "${features[@]}"

  client-legs:
    # Plan W7-d, report-only (plan §5): lightwalletd-dd and chain-viz (polling, K-17), unmodified at
    # the pinned commits, against a regtest zakurad with the vault and yed_* fixtures on and off.
    # The checks are crates/kogany-rpc/qa/kogany_client_legs.py; it exits 0 whatever they say, and
    # the report is the step summary and the `kogany-client-legs` artifact.
    name: client legs (lightwalletd-dd, chain-viz; report-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    permissions:
      contents: read
    env:
      LWD_REPO: https://github.com/boyfromcave/lightwalletd.git
      LWD_REV: a1d141e37776dcfb0e4be023661d59508ab5b616        # lightwalletd-dd vaults/kogany-compat
      CHAINVIZ_REPO: https://github.com/boyfromcave/chain-viz.git
      CHAINVIZ_REV: 0165934bd65b87fa880c1263536718c525d33dd9   # chain-viz vaults/kogany-compat
      # A Ycash regtest transparent address (prefix 0x1C95). Mining is refused until plan W8 builds
      # Ycash coinbases; the script then records that and runs the legs at genesis.
      MINER_ADDRESS: smD3WkZZgTMcQJSER9RsPkrDoKguaqPTbQt
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f #v2.0.0 # zizmor: ignore[cache-poisoning] -- test-only build of the node, nothing published or released
        with:
          toolchain: stable
          cache-key: kogany-client-legs
          cache-on-failure: true
          cache-save-if: ${{ github.ref == 'refs/heads/vaults/kogany-compat' || github.ref == 'refs/heads/upgrade/vault' }}
      - uses: ./.github/actions/setup-zakura-build
      - name: Build zakurad (ycash feature)
        run: cargo build --locked -p zakura --bin zakurad --features ycash
      - name: Fetch the clients at their pins
        run: |
          for spec in "lightwalletd:$LWD_REPO:$LWD_REV" "chain-viz:$CHAINVIZ_REPO:$CHAINVIZ_REV"; do
            dir="${spec%%:*}"; rest="${spec#*:}"; rev="${rest##*:}"; url="${rest%:*}"
            git init -q "$RUNNER_TEMP/$dir"
            git -C "$RUNNER_TEMP/$dir" fetch -q --depth 1 "$url" "$rev"
            git -C "$RUNNER_TEMP/$dir" checkout -q FETCH_HEAD
          done
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ${{ runner.temp }}/lightwalletd/go.mod
          cache: false
      - name: Build lightwalletd-dd and its probe tool
        working-directory: ${{ runner.temp }}/lightwalletd
        env:
          CGO_ENABLED: '0'
        run: |
          go build -mod=vendor -o "$RUNNER_TEMP/bin/lightwalletd" .
          go build -mod=vendor -o "$RUNNER_TEMP/bin/lwdinfo" ./testtools/lwdinfo
      - name: Build chain-viz
        working-directory: ${{ runner.temp }}/chain-viz
        run: |
          cargo build --locked --release
          cp target/release/chain-viz "$RUNNER_TEMP/bin/chain-viz"
      - name: Client legs (report-only)
        run: |
          python3 crates/kogany-rpc/qa/kogany_client_legs.py \
            --zakurad target/debug/zakurad \
            --lightwalletd "$RUNNER_TEMP/bin/lightwalletd" --lwdinfo "$RUNNER_TEMP/bin/lwdinfo" \
            --chain-viz "$RUNNER_TEMP/bin/chain-viz" \
            --miner-address "$MINER_ADDRESS" --out kogany-client-legs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: kogany-client-legs
          path: kogany-client-legs
          retention-days: 30
          if-no-files-found: ignore
