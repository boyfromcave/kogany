name: kogany-mixed

# kogany's side of the mixed-line regtest (plan §5 "mixed-regtest"; workspace
# docs/plans/kogany/ci-design.md §5; .github/README-kogany.md "Cross-line contract"): this commit's
# koganyd (kogany-bin.yml, this run's koganyd-bin) with ycash6's node-bin at a pinned ycash6 commit,
# running the ycash6 harness from a checkout at that commit (qa/kogany_mixed_shards.py over
# qa/kogany-mixed-shards.txt). One job per shard group: a failed group re-runs alone with the same
# two binaries. Per group, the `gate` scripts block (KOGANY_STRICT=1) and the `report` scripts never
# fail the job; the shard list at the pinned commit says which is which (the coordinator flips a
# script to `gate` in ycash6 at a wave gate and bumps the YCASH6_REV pin here). The node group also
# runs kogany's own cross-line scripts (crates/kogany-rpc/qa), below.
#
# node-bin: from a push, schedule or dispatch run of ycash6's yellowback-tests.yml at the commit
# (artifact `ycash6-node-bin`, else `node-bin`, holding node-bin.tgz); `ycash6_run_id` names the
# run, else the newest such run at the commit is used. ycash6 is not built here (an hour of C++).
# The same run's `sidecars` artifact (yolo and chain-viz, built by its `sidecars` job) comes with
# it, for the two gate scripts that drive them.
on:
  push:
    branches: [upgrade/vault, "vaults/**"]
  pull_request:
    branches: [upgrade/vault, "vaults/**", "kc/**"]
  workflow_dispatch:
    inputs:
      ycash6_rev:
        description: 'the ycash6 commit (40 hex digits; empty: YCASH6_MIXED_REV)'
        type: string
        default: ''
      ycash6_run_id:
        description: 'the ycash6 yellowback-tests.yml run whose node-bin to use (empty: the newest at the commit)'
        type: string
        default: ''
  workflow_call:
    inputs:
      ycash6_rev:
        type: string
        default: ''
      ycash6_run_id:
        type: string
        default: ''
    secrets:
      YCASH6_ARTIFACT_TOKEN:
        required: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-mixed-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  YCASH6_REPO: boyfromcave/ycash6
  # The pin: ycash6 upgrade/vault at the merge of #136 (cd575cc7b: the 6.22.0-beta3 cut, the fast
  # testnet's mandate end at 512,417, on rpcversion 10, getcoinbasetemplatefor, transparentPools and
  # the shard list's beta3 gates), unless a dispatch or caller names another commit. Bump by PR, never a
  # branch tip.
  YCASH6_REV: ${{ inputs.ycash6_rev || 'cd575cc7b7d77208115e37811c421248586fd9dd' }}

jobs:
  koganyd:
    uses: ./.github/workflows/kogany-bin.yml
    permissions:
      contents: read

  ycash6-node-bin:
    name: ycash6 node-bin
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/scripts
      - name: Download and check the commit's node-bin
        env:
          GH_TOKEN: ${{ secrets.YCASH6_ARTIFACT_TOKEN || github.token }}
          RUN_ID: ${{ inputs.ycash6_run_id }}
          FETCH_SIDECARS: '1'
        run: .github/workflows/scripts/fetch-ycash6-node-bin.sh "$RUNNER_TEMP/dl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ycash6-node-bin
          path: |
            ${{ runner.temp }}/dl/node-bin.tgz
            ${{ runner.temp }}/dl/sidecars.tgz
          retention-days: 7
          if-no-files-found: error

  mixed:
    name: mixed ${{ matrix.group }}
    needs: [koganyd, ycash6-node-bin]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [node, vault, yed, fees, attest]
    steps:
      # The ycash6 tree at the binary's commit: its harness, test framework and shard list.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.YCASH6_REPO }}
          ref: ${{ env.YCASH6_REV }}
          persist-credentials: false
      - uses: ./.github/actions/yellowback-prereqs
        with:
          apt: 'false'
      - name: A C compiler (the Falcon signer of test_framework/pq.py) and librocksdb (koganyd)
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -q
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -q gcc libc6-dev librocksdb-dev
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ycash6-node-bin
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: koganyd-bin
          path: ${{ runner.temp }}
      - name: Unpack both lines
        run: |
          tar xzf "$RUNNER_TEMP/node-bin.tgz"
          # tests_config.ini is configure's output on ycash6's runner, so its SRCDIR/BUILDDIR name
          # ycash6's workspace path; here the ycash6 tree is this job's workspace. Without this
          # rpc-tests.py looks for create_cache.py and the scripts under a path that does not exist.
          sed -i -e "s|^SRCDIR=.*|SRCDIR=$GITHUB_WORKSPACE|" -e "s|^BUILDDIR=.*|BUILDDIR=$GITHUB_WORKSPACE|" \
            qa/pull-tester/tests_config.ini
          grep -E '^(SRCDIR|BUILDDIR)=' qa/pull-tester/tests_config.ini
          mkdir -p "$RUNNER_TEMP/zk" && tar xzf "$RUNNER_TEMP/koganyd-bin.tgz" -C "$RUNNER_TEMP/zk"
          cat "$RUNNER_TEMP/zk/koganyd-bin.json"
          "$RUNNER_TEMP/zk/koganyd" --version
          echo "KOGANY_BIN=$RUNNER_TEMP/zk/koganyd" >> "$GITHUB_ENV"
          # yolo and chain-viz from the same ycash6 run: yellowback_stratum and yellowback_chainviz
          # (attest group) SKIP without them, which --fail-on-skip turns into a failure.
          mkdir -p "$RUNNER_TEMP/sidecars" && tar xzf "$RUNNER_TEMP/sidecars.tgz" -C "$RUNNER_TEMP/sidecars"
          "$RUNNER_TEMP/sidecars/yolo" --version
          "$RUNNER_TEMP/sidecars/chain-viz" --version
          echo "YOLO_BIN=$RUNNER_TEMP/sidecars/yolo" >> "$GITHUB_ENV"
          echo "CHAINVIZ_BIN=$RUNNER_TEMP/sidecars/chain-viz" >> "$GITHUB_ENV"
      - name: fetch zcash params
        run: zcutil/fetch-params.sh
      # The harness gives every node fixed ports in bands from 11000 to 56000 (ycash6
      # qa/rpc-tests/test_framework/kogany.py: koganyd's RPC at 36000+, its P2P at 46000+). Linux
      # hands out ephemeral ports from 32768 to 60999, so with two scripts at a time one script's
      # outgoing connection could take another's listening port ("its p2p port ... is taken by
      # another process"). Keep the kernel out of the bands; 56000 to 60999 stays ephemeral.
      - name: reserve the harness port bands
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=31000-55999
      - name: the group's gate scripts (blocking, KOGANY_STRICT=1)
        id: gate
        env:
          TMPDIR: ${{ runner.temp }}/mixed-tests
          GROUP: ${{ matrix.group }}
        run: |
          mkdir -p "$TMPDIR"
          python3 qa/kogany_mixed_shards.py run "$GROUP" --state gate --jobs 2
      # kogany's own cross-line scripts (crates/kogany-rpc/qa), with the two binaries of this job and
      # kogany's scripts from this commit, once each, in the node group. reorg_parity.py (beta3
      # item 12, R1) blocks: an upstream sync that drops the guard from the state writer fails here.
      # The beta3 parity scripts after it are report-only until each has passed on a runner; the
      # coordinator then removes its continue-on-error. value_pools_parity.py and
      # rpc_insight_inputs_parity.py passed in the #42 PR run (43835275455) and block;
      # coinbase_for_parity.py passed in the #43 PR run ("16 paired blocks accepted on both lines")
      # and blocks.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ !cancelled() && matrix.group == 'node' }}
        with:
          path: kogany
          persist-credentials: false
          sparse-checkout: crates/kogany-rpc/qa
      - name: reorg_parity.py (koganyd's reorganisation guard against ycashd's)
        id: reorg
        if: ${{ !cancelled() && matrix.group == 'node' }}
        timeout-minutes: 20
        run: |
          mkdir -p "$RUNNER_TEMP/mixed-tests"
          python3 kogany/crates/kogany-rpc/qa/reorg_parity.py --koganyd "$KOGANY_BIN" \
            --ycash6-bin "$GITHUB_WORKSPACE/src" --workdir "$RUNNER_TEMP/mixed-tests/reorg-parity"
      # beta3 item 3: kogany's getcoinbasetemplatefor coinbases of every address kind, accepted by
      # ycashd (it needs a ycashd with getcoinbasetemplatefor, ycash6 #130). koganyd needs ycashd's
      # sapling-output.params to build a Sapling coinbase; ycash6's zcutil/fetch-params.sh above no
      # longer downloads it (6.x bundles the parameters in ycashd), so it comes from the project's
      # release with the pinned sum, as in kogany-tests.yml. Without it every Sapling call answered
      # "Sapling output parameters are not loaded" (the #42 PR run, 43835275455).
      - name: The Sapling output parameters (ycash-infra zcash-params-v1, the pinned sum)
        if: ${{ !cancelled() && matrix.group == 'node' }}
        run: |
          curl -fsSL --retry 3 --max-time 120 --max-filesize 4000000 -o "$RUNNER_TEMP/sapling-output.params" \
            https://github.com/boyfromcave/ycash-infra/releases/download/zcash-params-v1/sapling-output.params
          echo "2f0ebbcbb9bb0bcffe95a397e7eba89c29eb4dde6191c339db88570e3f3fb0e4  $RUNNER_TEMP/sapling-output.params" | sha256sum -c -
      - name: coinbase_for_parity.py (getcoinbasetemplatefor against ycashd)
        id: coinbase_for
        if: ${{ !cancelled() && matrix.group == 'node' }}
        timeout-minutes: 45
        run: |
          mkdir -p "$RUNNER_TEMP/mixed-tests"
          python3 kogany/crates/kogany-rpc/qa/coinbase_for_parity.py --koganyd "$KOGANY_BIN" \
            --ycashd-bin "$GITHUB_WORKSPACE/src" --solver-dir "$GITHUB_WORKSPACE/qa/rpc-tests" \
            --sapling-output-params "$RUNNER_TEMP/sapling-output.params" \
            --workdir "$RUNNER_TEMP/mixed-tests/coinbase-for-parity"
      # beta3 items 2 and 11: transparentPools and transactions at every height of the chain ycash6's
      # value_pools_by_type.py mines (a ycashd with transparentPools, ycash6 #130; its test from the
      # same checkout).
      - name: value_pools_parity.py (transparentPools and transactions against ycashd)
        id: value_pools
        if: ${{ !cancelled() && matrix.group == 'node' }}
        timeout-minutes: 60
        run: |
          mkdir -p "$RUNNER_TEMP/mixed-tests"
          python3 kogany/crates/kogany-rpc/qa/value_pools_parity.py --koganyd "$KOGANY_BIN" \
            --ycashd-bin "$GITHUB_WORKSPACE/src" --ycash6-qa "$GITHUB_WORKSPACE/qa/rpc-tests" \
            --python python3 --workdir "$RUNNER_TEMP/mixed-tests/value-pools-parity"
      # beta3 item 6: the opt-in insight input fields and blockfee against a -insightexplorer ycashd
      # (one that names the address of a post-quantum input, ycash6 #128).
      - name: rpc_insight_inputs_parity.py (insight input fields and blockfee against ycashd)
        id: insight_inputs
        if: ${{ !cancelled() && matrix.group == 'node' }}
        timeout-minutes: 30
        run: |
          mkdir -p "$RUNNER_TEMP/mixed-tests"
          python3 kogany/crates/kogany-rpc/qa/rpc_insight_inputs_parity.py --koganyd "$KOGANY_BIN" \
            --ycash6-bin "$GITHUB_WORKSPACE/src" --workdir "$RUNNER_TEMP/mixed-tests/insight-inputs-parity"
      - name: the group's report scripts (a failure is reported, the job stays green)
        id: report
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          TMPDIR: ${{ runner.temp }}/mixed-tests
          GROUP: ${{ matrix.group }}
        run: |
          mkdir -p "$TMPDIR"
          python3 qa/kogany_mixed_shards.py run "$GROUP" --state report --jobs 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && (steps.gate.outcome == 'failure' || steps.report.outcome == 'failure' || steps.reorg.outcome == 'failure' || steps.coinbase_for.outcome == 'failure' || steps.value_pools.outcome == 'failure' || steps.insight_inputs.outcome == 'failure') }}
        with:
          name: kogany-mixed-logs-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/mixed-tests/**/node*/regtest/debug.log
            ${{ runner.temp }}/mixed-tests/**/kogany*/zakurad.log
            ${{ runner.temp }}/mixed-tests/**/kogany*/zakurad.toml
            ${{ runner.temp }}/mixed-tests/**/kogany*/koganyd.log
            ${{ runner.temp }}/mixed-tests/**/kogany*/koganyd.toml
            ${{ runner.temp }}/mixed-tests/reorg-parity/**/*.out
            ${{ runner.temp }}/mixed-tests/*-parity/**/*.log
          retention-days: 14
          if-no-files-found: warn
