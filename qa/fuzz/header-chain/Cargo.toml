[package]
name = "zakura-header-chain-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
zakura-chain = { path = "../../../crates/zakura-chain" }
zakura-header-chain = { path = "../../../crates/zakura-header-chain", features = ["fuzz-impl"] }
zakura-network = { path = "../../../crates/zakura-network", features = ["header-fuzz"] }
zakura-state = { path = "../../../crates/zakura-state", features = ["header-fuzz"] }

[[bin]]
name = "header_codec_v9"
path = "fuzz_targets/header_codec_v9.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fork_transitions"
path = "fuzz_targets/fork_transitions.rs"
test = false
doc = false
bench = false

[[bin]]
name = "header_pursuit"
path = "fuzz_targets/header_pursuit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "recovery_rows"
path = "fuzz_targets/recovery_rows.rs"
test = false
doc = false
bench = false

[workspace]

# The root workspace's patches, copied: this package is a workspace of its own, and
# zakura-chain needs the common fork (zakura-common-ycash) for the Ycash network
# upgrades. Keep them equal to the root's.
[patch.crates-io]
zakura-address          = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }
zakura-bellman          = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }
zakura-bls12-381        = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }
zakura-equihash         = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }
zakura-halo2-gadgets    = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }
zakura-halo2-poseidon   = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }
zakura-halo2-proofs     = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }
zakura-jubjub           = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }
zakura-note-encryption  = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }
zakura-orchard          = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }
zakura-orchard-legacy   = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }
zakura-pairing          = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }
zakura-pasta-curves     = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }
zakura-primitives       = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }
zakura-protocol         = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }
zakura-reddsa           = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }
zakura-redjubjub        = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }
zakura-sapling-crypto   = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }
zakura-sensei           = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }
zakura-sensei-artifacts = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }
zakura-sensei-macros    = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }
zakura-sensei-shared    = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }
zakura-sinsemilla       = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }
zakura-transparent      = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }
zakura-zcash-script     = { git = "https://github.com/boyfromcave/zakura-common-ycash", rev = "9e5b70bb04f628c3c53fd0bde45d7b51715c168e" }

# udon 0.2.0 and bento 0.1.0 were published from earlier commits than the
# fork base, which changed them without a version bump; keep the crates.io
# packages so they stay byte-identical to what upstream Zakura builds.
[patch."https://github.com/boyfromcave/zakura-common-ycash"]
zakura-udon         = { version = "=0.2.0" }
zakura-bento        = { version = "=0.1.0" }
zakura-bento-core   = { version = "=0.1.0" }
zakura-bento-macros = { version = "=0.1.0" }

